<!-- @dsCard group="Foundations" viewport="700x210" subtitle="Focus outline · hover tint · selection edge · editing caret" name="Interaction states" -->
<!DOCTYPE html><html data-ba-color-scheme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--ba-color-bg-default);color:var(--ba-color-fg-default);padding:24px;font-family:var(--ba-font-mono);display:flex;flex-direction:column;gap:12px}</style></head><body>
<div style="display:flex;gap:14px;align-items:center">
  <span style="border:var(--ba-border-strong);padding:6px 14px;font-size:var(--ba-font-size-1);letter-spacing:0.1em;outline:var(--ba-focus-outline);outline-offset:var(--ba-focus-offset)">[ FOCUSED ]</span>
  <span style="border:var(--ba-border-strong);background:var(--ba-color-bg-hint);padding:6px 14px;font-size:var(--ba-font-size-1);letter-spacing:0.1em">[ HOVERED ]</span>
  <span style="background:var(--ba-color-bg-disabled);color:var(--ba-color-fg-disabled);padding:6px 14px;font-size:var(--ba-font-size-1);letter-spacing:0.1em">[ DISABLED ]</span>
</div>
<div style="display:flex;align-items:center;gap:8px;padding:5px 12px;font-size:var(--ba-font-size-3);background:var(--ba-color-bg-hint);border-left:var(--ba-selection-edge)"><span style="width:12px;color:var(--ba-color-fg-positive)">›</span><span style="font-weight:700">Selected row — hint bg + 2px positive edge</span></div>
<div style="display:flex;align-items:center;gap:10px;border:1px solid var(--ba-color-focus);background:var(--ba-color-bg-recessed);padding:8px 12px;font-size:var(--ba-font-size-2)"><span>editing~/.config/zed<span style="display:inline-block;width:7px;height:14px;background:var(--ba-color-focus);vertical-align:text-bottom"></span></span><span style="margin-left:auto;font-size:var(--ba-font-size-0);color:var(--ba-color-fg-hint)">⏎ SAVE · esc REVERT</span></div>
<div style="font-size:var(--ba-font-size-0);color:var(--ba-color-fg-hint);letter-spacing:var(--ba-font-letterspacing-label)">FOCUS = 1PX POSITIVE OUTLINE, 2PX OFFSET · HOVER = ONE TIER LIGHTER · 80–150MS EASE-OUT</div>
</body></html>
