<!-- @dsCard group="Colors" viewport="700x170" subtitle="Muted intents — square pip + mono label, never alone" name="Semantic intents" -->
<!DOCTYPE html><html data-ba-color-scheme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--ba-color-bg-default);color:var(--ba-color-fg-default);padding:24px;font-family:var(--ba-font-mono);display:flex;flex-direction:column;gap:16px}</style></head><body>
<div style="display:flex;gap:28px;font-size:var(--ba-font-size-0);letter-spacing:0.1em">
  <span style="display:flex;align-items:center;gap:6px;color:var(--ba-color-fg-positive)"><span style="width:var(--ba-size-pip);height:var(--ba-size-pip);background:var(--ba-color-fg-positive)"></span>POSITIVE · SYNCED · FOCUS</span>
  <span style="display:flex;align-items:center;gap:6px;color:var(--ba-color-fg-warn)"><span style="width:var(--ba-size-pip);height:var(--ba-size-pip);background:var(--ba-color-fg-warn)"></span>WARN · CHECK</span>
  <span style="display:flex;align-items:center;gap:6px;color:var(--ba-color-fg-negative)"><span style="width:var(--ba-size-pip);height:var(--ba-size-pip);background:var(--ba-color-fg-negative)"></span>NEGATIVE · ERROR</span>
  <span style="display:flex;align-items:center;gap:6px;color:var(--ba-color-fg-info)"><span style="width:var(--ba-size-pip);height:var(--ba-size-pip);background:var(--ba-color-fg-info)"></span>INFO</span>
</div>
<div style="font-size:var(--ba-font-size-0);color:var(--ba-color-fg-hint);letter-spacing:var(--ba-font-letterspacing-label)">MUTED, NEVER NEON · GREEN IS THE ONLY ACCENT IN CHROME · PIPS ARE SQUARE</div>
</body></html>
