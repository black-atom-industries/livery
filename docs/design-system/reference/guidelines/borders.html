<!-- @dsCard group="Foundations" viewport="700x200" subtitle="1px seams, 0 radius, fg-derived — section header pattern" name="Borders & rules" -->
<!DOCTYPE html><html data-ba-color-scheme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--ba-color-bg-default);color:var(--ba-color-fg-default);padding:24px;font-family:var(--ba-font-mono);display:flex;flex-direction:column;gap:14px}</style></head><body>
<div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:var(--ba-font-size-0);letter-spacing:var(--ba-font-letterspacing-label);color:var(--ba-color-fg-hint)">SECTION HEADER · LABEL + HAIRLINE RULE</span><span style="flex:1;border-bottom:var(--ba-border-subtle)"></span><span style="font-size:var(--ba-font-size-0);color:var(--ba-color-fg-disabled)">META RIGHT</span></div>
<div style="display:flex;gap:12px">
  <div style="flex:1;border:var(--ba-border);padding:12px;font-size:var(--ba-font-size-0);color:var(--ba-color-fg-hint);letter-spacing:0.08em">PANEL · border-default (fg 18%)</div>
  <div style="flex:1;border:var(--ba-border-subtle);padding:12px;font-size:var(--ba-font-size-0);color:var(--ba-color-fg-hint);letter-spacing:0.08em">NESTED · border-subtle (fg 10%)</div>
  <div style="flex:1;border:var(--ba-border-strong);padding:12px;font-size:var(--ba-font-size-0);color:var(--ba-color-fg-hint);letter-spacing:0.08em">EMPHASIS · border-strong (fg 45%)</div>
</div>
<div style="font-size:var(--ba-font-size-0);color:var(--ba-color-fg-hint);letter-spacing:var(--ba-font-letterspacing-label)">RADIUS 0 EVERYWHERE · NO SHADOWS · BORDERS DERIVE FROM FG SO THEY RE-TINT WITH THE THEME</div>
</body></html>
