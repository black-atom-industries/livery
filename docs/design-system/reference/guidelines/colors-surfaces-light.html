<!DOCTYPE html><html data-ba-color-scheme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--ba-color-bg-default);color:var(--ba-color-fg-default);padding:20px;font-family:var(--ba-font-mono)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:2px;font-size:var(--ba-font-size-00);color:var(--ba-color-fg-hint)">
  <div><div style="height:64px;background:var(--ba-color-bg-recessed);border:var(--ba-border-subtle)"></div><div style="padding-top:5px;letter-spacing:0.08em">RECESSED<br>inputs · code</div></div>
  <div><div style="height:64px;background:var(--ba-color-bg-default);border:var(--ba-border-subtle)"></div><div style="padding-top:5px;letter-spacing:0.08em">DEFAULT<br>page</div></div>
  <div><div style="height:64px;background:var(--ba-color-bg-subtle);border:var(--ba-border-subtle)"></div><div style="padding-top:5px;letter-spacing:0.08em">SUBTLE<br>panels · bars</div></div>
  <div><div style="height:64px;background:var(--ba-color-bg-hint);border:var(--ba-border-subtle)"></div><div style="padding-top:5px;letter-spacing:0.08em">HINT<br>selection · hover</div></div>
  <div><div style="height:64px;background:var(--ba-color-bg-contrast)"></div><div style="padding-top:5px;letter-spacing:0.08em">CONTRAST<br>primary actions</div></div>
</div>
<div style="margin-top:12px;font-size:var(--ba-font-size-0);color:var(--ba-color-fg-hint);letter-spacing:var(--ba-font-letterspacing-label)">HUE 30 · NO PURE WHITE · PAPER WARMTH, NOT OLIVE</div>
</body></html>
