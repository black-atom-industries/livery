<!DOCTYPE html><html data-ba-color-scheme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;background:var(--ba-color-bg-default);color:var(--ba-color-fg-default);padding:20px;font-family:var(--ba-font-mono);display:flex;flex-direction:column;gap:14px}</style></head><body>
<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
  <span style="background:var(--ba-color-bg-contrast);color:var(--ba-color-fg-contrast);padding:6px 14px;font-weight:700;font-size:var(--ba-font-size-1);letter-spacing:0.1em">[ APPLY THEME ]</span>
  <span style="border:var(--ba-border-strong);padding:6px 14px;font-size:var(--ba-font-size-1);letter-spacing:0.1em">[ <span style="color:var(--ba-color-fg-positive)">r</span> RETRY FAILED ]</span>
  <span style="color:var(--ba-color-fg-subtle);padding:6px 14px;font-size:var(--ba-font-size-1);letter-spacing:0.1em">[ DISMISS ]</span>
  <span style="background:var(--ba-color-bg-disabled);color:var(--ba-color-fg-disabled);padding:6px 14px;font-size:var(--ba-font-size-1);letter-spacing:0.1em">[ DISABLED ]</span>
</div>
<div style="display:flex;gap:18px;font-size:var(--ba-font-size-1);color:var(--ba-color-fg-hint)"><span><span style="color:var(--ba-color-fg-subtle)">j/k</span> NAVIGATE</span><span><span style="color:var(--ba-color-fg-subtle)">/</span> SEARCH</span><span><span style="color:var(--ba-color-fg-subtle)">f</span> FILTERS</span><span><span style="color:var(--ba-color-fg-subtle)">⏎</span> APPLY</span><span><span style="color:var(--ba-color-fg-subtle)">esc</span> BACK</span></div>
</body></html>
