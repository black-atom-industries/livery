<!DOCTYPE html><html data-ba-color-scheme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;background:var(--ba-color-bg-default);color:var(--ba-color-fg-default);padding:20px;font-family:var(--ba-font-mono);display:flex;flex-direction:column;gap:12px}</style></head><body>
<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;font-size:var(--ba-font-size-0)">
  <span style="border:var(--ba-border-strong);letter-spacing:var(--ba-font-letterspacing-label);padding:3px 8px;color:var(--ba-color-fg-subtle)">DARK</span>
  <span style="display:flex;align-items:center;gap:6px;color:var(--ba-color-fg-positive);letter-spacing:0.1em"><span style="width:8px;height:8px;background:var(--ba-color-fg-positive)"></span>SYNCED 8/8</span>
  <span style="display:flex;align-items:center;gap:6px;color:var(--ba-color-fg-default);letter-spacing:0.1em"><span style="width:8px;height:8px;background:var(--ba-color-fg-default)"></span>RUNNING</span>
  <span style="display:flex;align-items:center;gap:6px;color:var(--ba-color-fg-disabled);letter-spacing:0.1em"><span style="width:8px;height:8px;border:var(--ba-border);box-sizing:border-box"></span>PENDING</span>
  <span style="display:flex;align-items:center;gap:6px;color:var(--ba-color-fg-negative);letter-spacing:0.1em"><span style="width:8px;height:8px;background:var(--ba-color-fg-negative)"></span>ERROR</span>
</div>
<div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:var(--ba-font-size-0);letter-spacing:var(--ba-font-letterspacing-label);color:var(--ba-color-fg-hint)">PRIMARIES · 12</span><span style="flex:1;border-bottom:var(--ba-border-subtle)"></span><span style="font-size:var(--ba-font-size-0);color:var(--ba-color-fg-disabled)">REV 03</span></div>
<div style="display:flex;gap:2px;font-size:var(--ba-font-size-00);color:var(--ba-color-fg-hint);max-width:420px">
  <div style="flex:1"><div style="height:26px;background:#C46A5A"></div><div style="padding-top:3px">C46A5A</div></div>
  <div style="flex:1"><div style="height:26px;background:#D9A662"></div><div style="padding-top:3px">D9A662</div></div>
  <div style="flex:1"><div style="height:26px;background:#8FA36B"></div><div style="padding-top:3px">8FA36B</div></div>
  <div style="flex:1"><div style="height:26px;background:#A97BA2"></div><div style="padding-top:3px">A97BA2</div></div>
</div>
<div style="display:flex;gap:24px">
  <div style="flex:1;display:flex;flex-direction:column;gap:6px;font-size:var(--ba-font-size-1);max-width:280px">
    <div style="display:flex;justify-content:space-between"><span style="color:var(--ba-color-fg-hint);letter-spacing:0.1em">COLLECTION</span><span style="color:var(--ba-color-fg-subtle)">JPN</span></div>
    <div style="display:flex;justify-content:space-between"><span style="color:var(--ba-color-fg-hint);letter-spacing:0.1em">STATUS</span><span style="color:var(--ba-color-fg-positive)">■ SYNCED</span></div>
  </div>
  <div style="flex:1">
    <div style="display:flex;align-items:center;gap:8px;padding:5px 12px;font-size:var(--ba-font-size-3);background:var(--ba-color-bg-hint);border-left:var(--ba-selection-edge)"><span style="width:12px;color:var(--ba-color-fg-positive)">›</span><span style="flex:1;font-weight:700">Koyo Yoru</span><span style="display:flex;gap:2px"><span style="width:7px;height:7px;background:#C46A5A"></span><span style="width:7px;height:7px;background:#D9A662"></span><span style="width:7px;height:7px;background:#8FA36B"></span><span style="width:7px;height:7px;background:#A97BA2"></span></span><span style="font-size:var(--ba-font-size-00);border:var(--ba-border);color:var(--ba-color-fg-hint);padding:1px 4px">D</span></div>
  </div>
</div>
<div style="height:3px;background:var(--ba-color-bg-hint);max-width:420px"><div style="height:3px;background:var(--ba-color-fg-positive);width:43%"></div></div>
<div style="background:var(--ba-color-bg-recessed);border:var(--ba-border-subtle);padding:10px 12px;font-size:var(--ba-font-size-2);line-height:1.7;color:#D9CBAE;max-width:420px"><span style="color:#6B5D4C">// rendered in theme</span><br><span style="color:#C46A5A">const</span> path = <span style="color:#7E93B0">expand</span>(<span style="color:#8FA36B">"~/.config"</span>);</div>
</body></html>
