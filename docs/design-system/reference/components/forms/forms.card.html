<!-- @dsCard group="Components" viewport="700x260" subtitle="Prompt · text input · toggle · chips · radio group" name="Forms" -->
<!DOCTYPE html><html data-ba-color-scheme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;background:var(--ba-color-bg-default);color:var(--ba-color-fg-default);padding:20px;font-family:var(--ba-font-mono);display:flex;flex-direction:column;gap:14px}</style></head><body>
<div style="display:flex;align-items:center;gap:10px;border:var(--ba-border);background:var(--ba-color-bg-recessed);padding:8px 12px;font-size:var(--ba-font-size-3);max-width:420px"><span style="color:var(--ba-color-fg-positive);font-weight:700">»</span><span>koyo<span style="display:inline-block;width:7px;height:14px;background:var(--ba-color-focus);vertical-align:text-bottom"></span></span><span style="margin-left:auto;font-size:var(--ba-font-size-1);color:var(--ba-color-fg-hint)">2/24</span></div>
<div style="display:flex;gap:14px;max-width:560px">
  <div style="flex:1;display:flex;flex-direction:column;gap:6px"><span style="font-size:var(--ba-font-size-0);letter-spacing:var(--ba-font-letterspacing-label);color:var(--ba-color-fg-hint)">CONFIG_PATH</span><span style="background:var(--ba-color-bg-recessed);border:var(--ba-border);padding:8px 12px;font-size:var(--ba-font-size-2)">~/.config/ghostty/config</span></div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px"><span style="font-size:var(--ba-font-size-0);letter-spacing:var(--ba-font-letterspacing-label);color:var(--ba-color-fg-hint)">THEMES_PATH <span style="color:var(--ba-color-fg-disabled)">· OPTIONAL</span></span><span style="background:var(--ba-color-bg-recessed);border:var(--ba-border);padding:8px 12px;font-size:var(--ba-font-size-2);color:var(--ba-color-fg-disabled)">optional — leave empty to skip</span></div>
</div>
<div style="display:flex;gap:20px;align-items:center">
  <span style="display:inline-flex;align-items:center;width:38px;height:22px;border:var(--ba-border-strong);padding:0 3px;justify-content:flex-end;box-sizing:border-box"><span style="width:14px;height:14px;background:var(--ba-color-fg-positive)"></span></span>
  <span style="display:inline-flex;align-items:center;width:38px;height:22px;border:var(--ba-border);padding:0 3px;justify-content:flex-start;box-sizing:border-box"><span style="width:14px;height:14px;background:var(--ba-color-fg-disabled)"></span></span>
  <span style="display:flex;gap:6px;font-size:var(--ba-font-size-0);letter-spacing:var(--ba-font-letterspacing-chip)">
    <span style="background:var(--ba-color-bg-contrast);color:var(--ba-color-fg-contrast);padding:3px 8px;font-weight:700">ALL</span>
    <span style="border:var(--ba-border);color:var(--ba-color-fg-subtle);padding:3px 8px"><span style="color:var(--ba-color-fg-positive)">3</span> JPN</span>
    <span style="background:var(--ba-color-bg-contrast);color:var(--ba-color-fg-contrast);padding:3px 8px;font-weight:700;outline:var(--ba-focus-outline);outline-offset:var(--ba-focus-offset)">4 TERRA</span>
  </span>
  <span style="display:flex;gap:6px;font-size:var(--ba-font-size-0);letter-spacing:var(--ba-font-letterspacing-chip)">
    <span style="background:var(--ba-color-bg-contrast);color:var(--ba-color-fg-contrast);padding:3px 8px;font-weight:700">KEEP + REPORT</span>
    <span style="border:var(--ba-border);color:var(--ba-color-fg-subtle);padding:3px 8px">ROLL BACK</span>
  </span>
</div>
</body></html>
