<!DOCTYPE html><html data-ba-color-scheme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;background:var(--ba-color-bg-default);color:var(--ba-color-fg-default);padding:20px;font-family:var(--ba-font-mono);display:flex;flex-direction:column;gap:12px}</style></head><body>
